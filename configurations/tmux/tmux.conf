
# used flags for set
# -g    set a global session option
# -s    change server options
# -a    append to string options

set -g default-shell /usr/bin/zsh

set -g mouse on

set -g default-terminal "tmux-256color"

# Enable truecolour support
# https://github.com/tmux/tmux/wiki/FAQ#how-do-i-use-rgb-colour
# set -as terminal-features ",alactritty*:RGB"

# set default terminal mode to 256 colors
set -ga terminal-overrides ",alactritty:RGB"

set -g escape-time 10
set -g base-index 1             # Start tab numbering at 1
set -g pane-base-index 1        # start with pane 1
set -g prefix C-a               # Setting the prefix from C-b to C-a
set -g mode-keys vi             # use vi style mode keys
set -g allow-rename off         # dont rename windows on every command
set -g history-limit 10000      # increase scrollback history lines

set-option -g focus-events on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

##
# handle URLs with urlview
#
bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; run-shell "$TERMINAL -e urlview /tmp/tmux-buffer"

##
# unbindings
#
unbind r
unbind '"'  # unbind horizontal split
unbind %    # unbind vertical split
unbind C-b  # default action
unbind [
unbind p

##
# bindings
#
# enable pane switching with alt+arrow keys
#
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind - split-window -v -c "#{pane_current_path}"    # using - to split vertically
bind | split-window -h -c "#{pane_current_path}"    # using | to split horizontally
bind r source-file ~/.config/tmux/tmux.conf         # force a reload of the config file
bind C-a last-window                                # toggle last window like screen
bind C-a send-prefix                                # screen like prefix

##
# Vim Style visual selection / yanking
#
bind Escape copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"

if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind p paste-buffer

# binding function keys like boybu
bind -n F2 new-window
bind -n F3 prev
bind -n F4 next

bind C-l send-keys 'C-l'
bind C-j display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"

run-shell ~/.config/tmux/plugins/tmux-open/open.tmux

# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

## COLORSCHEME: gruvbox dark (medium)
set-option -g status "on"

# default statusbar color
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1

# default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1

# pane border
set-option -g pane-active-border-style fg=colour250 #fg2
set-option -g pane-border-style fg=colour237 #bg1

# message infos
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# pane number display
set-option -g display-panes-active-colour colour250 #fg2
set-option -g display-panes-colour colour237 #bg1

# clock
set-window-option -g clock-mode-colour colour109 #blue

# bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left ""
set-option -ga status-left "#[bg=colour241,fg=colour248] #S "
set-option -ga status-left "#[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]"


set-option -g status-right ""
set-option -ga status-right "#[bg=colour237,fg=colour239 nobold, nounderscore, noitalics]"
set-option -ga status-right "#[bg=colour239,fg=colour246] %Y-%m-%d  %H:%M "
set-option -ga status-right "#[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]"
set-option -ga status-right "#[bg=colour248,fg=colour237] #h "

set-window-option -g window-status-current-format ""
set-window-option -ga window-status-current-format "#[bg=colour223,fg=colour237,nobold,noitalics,nounderscore]"
set-window-option -ga window-status-current-format "#[bg=colour223,fg=colour239] #I "
set-window-option -ga window-status-current-format "#[bg=colour223,fg=colour239,bold] #W#{?window_zoomed_flag,*Z,} "
set-window-option -ga window-status-current-format "#[bg=colour237,fg=colour223,nobold,noitalics,nounderscore]"

set-window-option -g window-status-format ""
set-window-option -ga window-status-format "#[bg=colour239,fg=colour237,noitalics]"
set-window-option -ga window-status-format "#[bg=colour239,fg=colour223] #I "
set-window-option -ga window-status-format "#[bg=colour239,fg=colour223] #W "
set-window-option -ga window-status-format "#[bg=colour237,fg=colour239,noitalics]"

